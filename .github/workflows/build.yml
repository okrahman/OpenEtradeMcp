name: production-read-mcp
on:
  push:
    branches: [main, feat/read-only-persistent-oauth, codex/production-readonly-cloud-mcp]
  pull_request:
    branches: [main, feat/read-only-persistent-oauth]
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build OpenEtradeMcp.sln -c Release
      - name: Unit and OAuth/assertion integration tests
        run: dotnet test tests/OpenEtradeMcp.Tests -c Release --no-build
      - name: Proxy boundaries
        run: python3 -m unittest discover -s tests -p 'test_proxy.py'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - name: Infrastructure validation
        run: |
          terraform -chdir=deploy/terraform fmt -check
          terraform -chdir=deploy/terraform init -backend=false
          terraform -chdir=deploy/terraform validate
      - name: Build pinned container images
        run: python3 deploy/build-images.py
      - name: Fixture TLS and container checks
        run: python3 tests/container_fixture.py
      - name: Host firewall isolation
        run: sudo -E deploy/verify-network.sh
