pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    client_max_body_size 32k;
    proxy_ssl_certificate /run/secrets/ingress.pfx.pem;
    proxy_ssl_certificate_key /run/secrets/ingress.key;
    proxy_ssl_trusted_certificate /run/secrets/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_verify_depth 2;
    server {
        listen 8443 ssl;
        ssl_certificate /run/secrets/public.crt;
        ssl_certificate_key /run/secrets/public.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'" always;
        location = /mcp {
            proxy_pass https://mcp:8443;
            proxy_ssl_name mcp;
            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_set_header Host $host;
        }
        location ~ ^/(owner(?:/.*)?|connect/(?:authorize|token)|\.well-known/(?:oauth-authorization-server|oauth-protected-resource|openid-configuration)|\.well-known/jwks)$ {
            proxy_pass https://authorization:8443;
            proxy_ssl_name authorization;
            proxy_set_header Host $host;
        }
        location / { return 404; }
    }
}
